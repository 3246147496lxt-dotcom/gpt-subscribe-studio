name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/server/requirements.txt sqlalchemy pytest pytest-asyncio
      - name: Run pytest suite
        run: python -m pytest
      - name: Run secret & release hygiene check on runtime code
        run: |
          python scripts/release_check.py --root packages
          python scripts/release_check.py --root services
          python scripts/release_check.py --root apps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Run frontend unit tests
        run: |
          node scripts/test-quick-pay.mjs
          node scripts/test-frontend-utils.mjs
      - name: Build production bundle
        run: npm run build
